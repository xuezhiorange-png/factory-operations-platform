name: m0-ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e './backend[dev]'
      - name: Test
        run: python -m pytest -q backend/tests
      - name: Ruff
        run: ruff check backend scripts

  frontend:
    name: Frontend / typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build (includes typecheck)
        working-directory: frontend
        run: npm run build
      - name: Install Chromium for browser checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check routes, interactions, responsive layout and accessibility
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-shell-browser-checks-${{ github.event_name }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docs:
    name: M0 / documentation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required artifacts
        run: python scripts/check_docs.py
