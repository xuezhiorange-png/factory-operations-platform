[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-operations-platform"
version = "0.2.0"
description = "Factory equipment operations platform, M1 minimum read foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "mcp==2.3.0",
  "PyJWT>=2.15.1,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.per-file-target-version]
# Standalone audit tests also run without backend dependencies on Python 3.10/3.11.
"tests/test_server_audit_tooling.py" = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
