name: m0-ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-python:
    name: Audit / Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the actual interpreter (no version substitution)
        env:
          EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python --version
          python - <<'PY'
          import os
          import sys
          expected = tuple(map(int, os.environ['EXPECTED_PYTHON_VERSION'].split('.')))
          assert sys.version_info[:2] == expected, sys.version
          print(f'ACTUAL_PYTHON={sys.version.split()[0]}')
          PY
      - name: Install standalone test dependencies only
        run: python -m pip install 'pytest>=8,<9'
      - name: Run synthetic audit and stdin compatibility tests without backend fixtures
        run: >-
          python -m pytest --noconftest -q
          backend/tests/test_server_audit_tooling.py
          scripts/tests/test_audit_compatibility.py
          scripts/tests/test_audit_runbook.py

  backend:
    name: Backend / tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: factory_ops_test
          POSTGRES_USER: factory_ops_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factory_ops_test -d factory_ops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FACTORY_OPS_TEST_DATABASE_URL: postgresql+psycopg://factory_ops_test:synthetic-ci-only@127.0.0.1:5432/factory_ops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e './backend[dev]'
      - name: Test
        run: python -m pytest -q backend/tests
      - name: Ruff
        run: ruff check backend scripts

  frontend:
    name: Frontend / typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: factory_ops_test
          POSTGRES_USER: factory_ops_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factory_ops_test -d factory_ops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FACTORY_OPS_TEST_DATABASE_URL: postgresql+psycopg://factory_ops_test:synthetic-ci-only@127.0.0.1:5432/factory_ops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build (includes typecheck)
        working-directory: frontend
        run: npm run build
      - name: Install Chromium for browser checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check routes, interactions, responsive layout and accessibility
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated business test server dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e './backend[dev]'
      - name: Build enabled read capability separately from the shell
        working-directory: frontend
        env:
          VITE_ASSETS_API_ENABLED: 'true'
        run: npm run build -- --outDir dist-business
      - name: Verify real API and PostgreSQL in PC and H5 (no auth artifacts)
        working-directory: frontend
        run: npm run test:business
      - name: Build identity capability separately
        working-directory: frontend
        env:
          VITE_ASSETS_API_ENABLED: 'true'
          VITE_IDENTITY_ENABLED: 'true'
        run: npm run build -- --outDir dist-identity
      - name: Verify HTTPS OAuth and sessions with synthetic Feishu transport
        working-directory: frontend
        run: npm run test:identity
      - name: Verify native portal against isolated API and PostgreSQL (no production or SSH)
        working-directory: frontend
        run: npm run test:portal
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-shell-browser-checks-${{ github.event_name }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docs:
    name: Platform / documentation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required artifacts
        run: python scripts/check_docs.py

  mcp-gateway:
    name: MCP / isolated HTTPS gateway and database roles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official MCP client and verification dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Check gateway tooling
        run: ruff check scripts/mcp_gateway_test.py deploy/mcp-test
      - name: Inspect local build prerequisites (no credentials)
        run: |
          docker --host=unix:///var/run/docker.sock version --format '{{.Client.Version}} / {{.Server.Version}}'
          docker --host=unix:///var/run/docker.sock compose version
          docker --host=unix:///var/run/docker.sock buildx version
          test -r /etc/ssl/certs/ca-certificates.crt
      - name: Verify local-only TLS, least database privileges and negative cases
        run: python scripts/mcp_gateway_test.py --report .mcp-gateway-test-results/report.json
      - name: Preserve only the sanitized status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-gateway-status-${{ github.event_name }}
          path: .mcp-gateway-test-results/report.json
          retention-days: 7
